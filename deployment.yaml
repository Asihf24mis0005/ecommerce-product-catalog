apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-catalog-deployment
  labels:
    app: ecommerce-catalog
spec:
  replicas: 4
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 60
  selector:
    matchLabels:
      app: ecommerce-catalog
  template:
    metadata:
      labels:
        app: ecommerce-catalog
    spec:
      containers:
      - name: catalog-container
        image: asihf/ecommerce-catalog:latest
        ports:
        - containerPort: 80
        imagePullPolicy: Always
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 2
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-catalog-service
spec:
  type: NodePort
  selector:
    app: ecommerce-catalog
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32003
